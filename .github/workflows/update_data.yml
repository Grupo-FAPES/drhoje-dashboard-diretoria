name: Update Dashboard Data

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'index.html'
      - 'dashboard_dr_hoje.html'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Run update script
      env:
        SALUSTECH_USER: ${{ secrets.SALUSTECH_USER }}
        SALUSTECH_PASS: ${{ secrets.SALUSTECH_PASS }}
        SALUSTECH_COMPANY: ${{ secrets.SALUSTECH_COMPANY }}
      run: python scripts/update_dashboard.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html dashboard_dr_hoje.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dashboard data" && git push)
