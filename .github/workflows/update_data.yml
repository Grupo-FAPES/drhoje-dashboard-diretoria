name: Update Dashboard Data

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'index.html'
      - 'dashboard_dr_hoje.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Run update script
      env:
        SALUSTECH_USER: ${{ secrets.SALUSTECH_USER }}
        SALUSTECH_PASS: ${{ secrets.SALUSTECH_PASS }}
        SALUSTECH_COMPANY: ${{ secrets.SALUSTECH_COMPANY }}
      run: python scripts/update_dashboard.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update dashboard data"
          for i in {1..3}; do
            if git pull --rebase origin main && git push origin main; then
              echo "Push realizado com sucesso na tentativa $i"
              break
            fi
            if [ $i -lt 3 ]; then
              echo "Falha no push. Tentando novamente em 5 segundos (tentativa $i)..."
              sleep 5
            fi
          done
        fi


